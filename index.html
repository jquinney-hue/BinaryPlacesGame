// Generate a 4-digit lobby code
const generateLobbyCode = () => {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no confusable chars
    let code = '';
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
};

// Serialize a question for Firebase (strips functions, keeps data)
const serializeQuestion = (q) => JSON.parse(JSON.stringify(q));

const QuizModeMenu = ({ playerName, onBack }) => {
    const [subView, setSubView] = useState('choice'); // choice | host_setup | host_lobby | host_game | host_results | join_code | join_lobby | join_game | join_results
    const [lobbyCode, setLobbyCode] = useState('');
    const [joinInput, setJoinInput] = useState('');
    const [joinError, setJoinError] = useState('');
    const [lobbyData, setLobbyData] = useState(null);
    const [playerId, setPlayerId] = useState('');
    const [hostConfig, setHostConfig] = useState({ numQuestions: 10, categoryId: 'all' });
    const [questions, setQuestions] = useState([]);
    const [currentQIdx, setCurrentQIdx] = useState(0);
    const [playerScore, setPlayerScore] = useState(0);
    const [playerInput, setPlayerInput] = useState('');
    const [playerBits, setPlayerBits] = useState([]);
    const [playerCarries, setPlayerCarries] = useState([]);
    const [answered, setAnswered] = useState(false);
    const [answerResult, setAnswerResult] = useState(null); // 'correct' | 'wrong' | null
    const [timeLeft, setTimeLeft] = useState(QUIZ_QUESTION_TIME);
    const [finalScores, setFinalScores] = useState([]);
    const listenerRefs = useRef({});
    const timerRef = useRef(null);
    const isHost = useRef(false);

    // Cleanup on unmount
    useEffect(() => {
        return () => {
            Object.values(listenerRefs.current).forEach(unsub => typeof unsub === 'function' && unsub());
            clearInterval(timerRef.current);
        };
    }, []);

    // ---- HOST FUNCTIONS ----
    const handleCreateLobby = () => {
        const code = generateLobbyCode();
        const pid = `host_${Date.now()}`;
        isHost.current = true;
        setLobbyCode(code);
        setPlayerId(pid);

        const lobbyRef = db.ref(`${QUIZ_ROOT}/lobbies/${code}`);
        lobbyRef.set({
            code,
            hostName: playerName,
            hostId: pid,
            status: 'waiting', // waiting | question | results | finished
            config: hostConfig,
            createdAt: Date.now(),
            players: {
                [pid]: { name: playerName, score: 0, isHost: true, joinedAt: Date.now() }
            },
            currentQuestion: -1,
            questions: []
        });

        // Remove lobby when host disconnects
        lobbyRef.onDisconnect().remove();

        // Listen to lobby changes
        const handler = lobbyRef.on('value', snap => {
            if (!snap.exists()) { setSubView('choice'); return; }
            setLobbyData(snap.val());
        });
        listenerRefs.current.lobby = () => lobbyRef.off('value', handler);

        setSubView('host_lobby');
    };

    const handleKickPlayer = (pid) => {
        db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}/players/${pid}`).remove();
    };

    const handleStartQuiz = () => {
        const cat = QUIZ_CATEGORIES.find(c => c.id === hostConfig.categoryId);
        const levels = cat ? cat.levels : [1,2,3,4,5,6,7,8,9];
        const qs = [];
        for (let i = 0; i < hostConfig.numQuestions; i++) {
            const lvl = levels[Math.floor(Math.random() * levels.length)];
            const q = generateQuestion(lvl, false);
            q.levelType = lvl;
            qs.push(serializeQuestion(q));
        }
        setQuestions(qs);
        db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}`).update({
            status: 'question',
            currentQuestion: 0,
            questions: qs,
            questionStartedAt: Date.now()
        });
    };

    const handleHostNextQuestion = () => {
        const nextIdx = currentQIdx + 1;
        if (nextIdx >= questions.length) {
            // End quiz
            db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}`).update({ status: 'finished' });
        } else {
            setCurrentQIdx(nextIdx);
            db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}`).update({
                currentQuestion: nextIdx,
                questionStartedAt: Date.now()
            });
        }
    };

    const handleHostEndGame = () => {
        db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}`).update({ status: 'finished' });
    };

    const handleDeleteLobby = () => {
        db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}`).remove();
        onBack();
    };

    // ---- JOIN FUNCTIONS ----
    const handleJoinLobby = async () => {
        const code = joinInput.trim().toUpperCase();
        if (code.length !== 4) { setJoinError('Enter a 4-character code.'); return; }
        const snap = await db.ref(`${QUIZ_ROOT}/lobbies/${code}`).get();
        if (!snap.exists()) { setJoinError('Lobby not found. Check the code.'); return; }
        const data = snap.val();
        if (data.status !== 'waiting') { setJoinError('This game has already started.'); return; }

        const pid = `player_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
        isHost.current = false;
        setPlayerId(pid);
        setLobbyCode(code);

        await db.ref(`${QUIZ_ROOT}/lobbies/${code}/players/${pid}`).set({
            name: playerName, score: 0, isHost: false, joinedAt: Date.now()
        });

        // Remove player on disconnect
        db.ref(`${QUIZ_ROOT}/lobbies/${code}/players/${pid}`).onDisconnect().remove();

        const lobbyRef = db.ref(`${QUIZ_ROOT}/lobbies/${code}`);
        const handler = lobbyRef.on('value', snap => {
            if (!snap.exists()) { setSubView('choice'); return; }
            const val = snap.val();
            setLobbyData(val);
        });
        listenerRefs.current.lobby = () => lobbyRef.off('value', handler);

        setSubView('join_lobby');
    };

    // Sync current question index from lobbyData
    useEffect(() => {
        if (!lobbyData) return;
        const idx = lobbyData.currentQuestion ?? -1;
        if (idx >= 0 && lobbyData.questions && lobbyData.questions[idx]) {
            if (idx !== currentQIdx || answerResult === null) {
                setCurrentQIdx(idx);
                setAnswered(false);
                setAnswerResult(null);
                setPlayerInput('');
                const q = lobbyData.questions[idx];
                if (q.levelType === 5) {
                    setPlayerBits(Array((q.bitsCount||8)+1).fill(0));
                    setPlayerCarries(Array((q.bitsCount||8)+1).fill(0));
                } else if (q.levelType === 3 || q.levelType === 9) {
                    setPlayerBits(Array(8).fill(0));
                } else {
                    setPlayerBits([]);
                }
            }
        }
        if (lobbyData.status === 'question' && idx >= 0) {
            if (!isHost.current) {
                setSubView('join_game');
            } else {
                setSubView('host_game');
            }
        }
        if (lobbyData.status === 'finished') {
            // Compile final scores
            const players = lobbyData.players || {};
            const sorted = Object.entries(players)
                .map(([id, p]) => ({ id, name: p.name, score: p.score || 0, isHost: p.isHost }))
                .sort((a,b) => b.score - a.score);
            setFinalScores(sorted);
            setSubView(isHost.current ? 'host_results' : 'join_results');
        }
    }, [lobbyData]);

    // Per-question timer for players (auto-submit on timeout)
    useEffect(() => {
        if (!lobbyData || lobbyData.status !== 'question' || answered || isHost.current) return;
        if (!lobbyData.questionStartedAt) return;
        const endAt = lobbyData.questionStartedAt + QUIZ_QUESTION_TIME * 1000;
        clearInterval(timerRef.current);
        const tick = () => {
            const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
            setTimeLeft(left);
            if (left === 0) { clearInterval(timerRef.current); if (!answered) submitAnswer(true); }
        };
        tick();
        timerRef.current = setInterval(tick, 250);
        return () => clearInterval(timerRef.current);
    }, [lobbyData?.currentQuestion, lobbyData?.status, answered]);

    const submitAnswer = (timedOut = false) => {
        if (answered) return;
        setAnswered(true);
        const q = lobbyData?.questions?.[currentQIdx];
        if (!q) return;
        let isCorrect = false;
        if (!timedOut) {
            if ((q.levelType===4||q.levelType===6) && parseInt(playerInput)===q.decimal) isCorrect=true;
            else if ((q.levelType===7||q.levelType===8) && playerInput.toUpperCase()===q.hexString) isCorrect=true;
            else if (q.levelType===5) { isCorrect=parseInt(playerBits.join(''),2)===parseInt((q.binResult||[]).join(''),2); }
            else if (q.levelType===3) { isCorrect=playerBits.reduce((a,b,i)=>a+(b*(POWERS[i]||0)),0)===q.decimal; }
            else if (q.levelType===9) { isCorrect=playerBits.reduce((a,b,i)=>a+(b*(POWERS[i]||0)),0)===q.decimal; }
            else if ((q.levelType===1||q.levelType===2) && playerInput !== '') {
                // For place value questions in quiz, just match single value
                isCorrect = false; // complex — skip for quiz simplicity, use numpad style
            }
        }
        const delta = isCorrect ? QUIZ_POINTS_CORRECT : (timedOut ? 0 : QUIZ_POINTS_WRONG);
        setAnswerResult(isCorrect ? 'correct' : (timedOut ? 'timeout' : 'wrong'));
        const newScore = Math.max(0, playerScore + delta);
        setPlayerScore(newScore);
        // Write score to Firebase
        db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}/players/${playerId}/score`).set(newScore);
    };

    // ---- QUIZ QUESTION RENDERER (Player side) ----
    const renderQuizQuestion = () => {
        const q = lobbyData?.questions?.[currentQIdx];
        if (!q) return <div className="text-slate-400">Loading question...</div>;

        const handleInput = (char) => {
            if (!answered) setPlayerInput(prev => {
                const max = (q.levelType===7||q.levelType===8) ? 2 : 3;
                return prev.length < max ? prev + char : prev;
            });
        };
        const handleDel = () => !answered && setPlayerInput(p => p.slice(0,-1));
        const handleToggleBit = (i) => {
            if (answered) return;
            const nb = [...playerBits]; nb[i] = nb[i] ? 0 : 1; setPlayerBits(nb);
        };
        const handleToggleCarry = (i) => {
            const nc = [...playerCarries]; nc[i] = nc[i] ? 0 : 1; setPlayerCarries(nc);
        };

        // Countdown bar color
        const pct = (timeLeft / QUIZ_QUESTION_TIME) * 100;
        const barColor = pct > 50 ? 'bg-emerald-500' : pct > 25 ? 'bg-yellow-500' : 'bg-red-500';

        return (
            <div className="w-full max-w-2xl mx-auto flex flex-col items-center gap-4">
                {/* Timer */}
                <div className="w-full flex items-center gap-3">
                    <div className="flex-1 h-3 bg-slate-800 rounded-full overflow-hidden">
                        <div className={`h-full ${barColor} transition-all`} style={{ width: `${pct}%` }}></div>
                    </div>
                    <span className={`font-mono font-bold text-lg w-8 text-right ${timeLeft <= 5 ? 'text-red-400 animate-pulse' : 'text-white'}`}>{timeLeft}</span>
                </div>

                {/* Question label */}
                <div className="text-center text-xs text-slate-400 uppercase tracking-widest">
                    Q{currentQIdx+1} / {questions.length || lobbyData?.questions?.length} · {LEVELS[q.levelType]?.title}
                </div>

                {answered && (
                    <div className={`w-full py-4 rounded-xl text-center font-bold text-xl fade-in ${answerResult==='correct'?'bg-emerald-600/30 border border-emerald-500 text-emerald-400':answerResult==='timeout'?'bg-slate-700 border border-slate-500 text-slate-400':'bg-red-600/30 border border-red-500 text-red-400'}`}>
                        {answerResult==='correct'?`✓ Correct! +${QUIZ_POINTS_CORRECT}`:answerResult==='timeout'?'⏱ Time\'s up!':` ✗ Wrong! ${QUIZ_POINTS_WRONG}`}
                    </div>
                )}

                {!answered && (
                    <>
                        {/* Render by type */}
                        {(q.levelType===4) && (
                            <div className="w-full">
                                <div className="text-center text-slate-300 font-bold mb-3">Binary → Decimal</div>
                                <div className="mb-4"><BinaryDisplay bits={q.bits} hideHeaders={false} useNibbles={false}/></div>
                                <div className="text-3xl font-mono text-blue-400 text-center mb-2">{playerInput || '_'}</div>
                                <Numpad onInput={handleInput} onDelete={handleDel} onSubmit={()=>submitAnswer()}/>
                            </div>
                        )}
                        {(q.levelType===6) && (
                            <div className="w-full flex flex-col items-center">
                                <div className="text-center text-slate-300 font-bold mb-3">Hex → Decimal</div>
                                <div className="flex gap-3 mb-4">{q.hexChars?.map((c,i)=><div key={i} className="w-16 h-20 bg-slate-700 rounded text-4xl font-mono flex items-center justify-center border-2 border-slate-600">{c}</div>)}</div>
                                <div className="text-3xl font-mono text-blue-400 mb-2">{playerInput || '_'}</div>
                                <Numpad onInput={handleInput} onDelete={handleDel} onSubmit={()=>submitAnswer()}/>
                            </div>
                        )}
                        {(q.levelType===7) && (
                            <div className="w-full flex flex-col items-center">
                                <div className="text-center text-slate-300 font-bold mb-3">Decimal → Hex</div>
                                <div className="text-6xl font-mono font-bold mb-6">{q.decimal}</div>
                                <div className="flex gap-2 mb-4">
                                    <div className="w-16 h-20 bg-slate-800 rounded text-4xl font-mono flex items-center justify-center border-2 border-blue-500">{playerInput[0]||'_'}</div>
                                    <div className="w-16 h-20 bg-slate-800 rounded text-4xl font-mono flex items-center justify-center border-2 border-blue-500">{playerInput[1]||'_'}</div>
                                </div>
                                <HexPad onInput={handleInput} onDelete={handleDel} onSubmit={()=>submitAnswer()}/>
                            </div>
                        )}
                        {(q.levelType===8) && (
                            <div className="w-full flex flex-col items-center">
                                <div className="text-center text-slate-300 font-bold mb-3">Binary → Hex</div>
                                <div className="mb-4 w-full"><BinaryDisplay bits={q.bits} hideHeaders={false} useNibbles={true}/></div>
                                <div className="flex gap-2 mb-4">
                                    <div className="w-16 h-20 bg-slate-800 rounded text-4xl font-mono flex items-center justify-center border-2 border-cyan-500">{playerInput[0]||'_'}</div>
                                    <div className="w-16 h-20 bg-slate-800 rounded text-4xl font-mono flex items-center justify-center border-2 border-cyan-500">{playerInput[1]||'_'}</div>
                                </div>
                                <HexPad onInput={handleInput} onDelete={handleDel} onSubmit={()=>submitAnswer()}/>
                            </div>
                        )}
                        {(q.levelType===3) && (
                            <div className="w-full flex flex-col items-center">
                                <div className="text-center text-slate-300 font-bold mb-2">Toggle bits to make:</div>
                                <div className="text-5xl font-mono font-bold mb-4 text-white">{q.decimal}</div>
                                <div className="flex gap-1 mb-4">{POWERS.map((p,i)=><div key={i} className="flex flex-col items-center"><div className="text-[10px] text-slate-500">{p}</div><button onClick={()=>handleToggleBit(i)} className={`w-9 h-12 rounded border ${playerBits[i]?'bg-blue-600 border-blue-400':'bg-slate-800 border-slate-600'}`}>{playerBits[i]}</button></div>)}</div>
                                <div className="text-slate-400 mb-3 font-mono">Sum: {playerBits.reduce((a,b,i)=>a+(b*(POWERS[i]||0)),0)}</div>
                                <Button onClick={()=>submitAnswer()} className="w-full max-w-xs">SUBMIT</Button>
                            </div>
                        )}
                        {(q.levelType===9) && (
                            <div className="w-full flex flex-col items-center">
                                <div className="text-center text-slate-300 font-bold mb-2">Hex → Binary</div>
                                <div className="text-5xl font-mono font-bold text-yellow-400 mb-4">{q.hexString}</div>
                                <div className="flex gap-1 mb-4">{POWERS.map((p,i)=><div key={i} className={`flex flex-col items-center ${i===4?'ml-4':''}`}><div className="text-[10px] text-slate-500">{NIBBLE_POWERS[i]}</div><button onClick={()=>handleToggleBit(i)} className={`w-9 h-12 rounded border ${playerBits[i]?'bg-blue-600 border-blue-400':'bg-slate-800 border-slate-600'}`}>{playerBits[i]}</button></div>)}</div>
                                <div className="text-slate-400 mb-3 font-mono text-sm">= {playerBits.reduce((a,b,i)=>a+(b*(POWERS[i]||0)),0).toString(16).toUpperCase().padStart(2,'0')}</div>
                                <Button onClick={()=>submitAnswer()} className="w-full max-w-xs">SUBMIT</Button>
                            </div>
                        )}
                        {(q.levelType===5) && (
                            <div className="w-full flex flex-col items-center">
                                <div className="text-center text-slate-300 font-bold mb-3">Binary Addition</div>
                                <div className="overflow-x-auto w-full flex justify-center mb-4">
                                    <div className="grid gap-1" style={{gridTemplateColumns:`repeat(${(q.bitsCount||8)+1}, minmax(2rem,1fr))`}}>
                                        {playerCarries.map((c,i)=><button key={i} onClick={()=>handleToggleCarry(i)} className={`w-7 h-7 rounded text-xs font-bold ${c?'bg-orange-500':'bg-slate-700'}`}>{c}</button>)}
                                        <div className="col-span-full h-px bg-slate-600 my-1"></div>
                                        {Array((q.bitsCount||8)+1).fill(0).map((_,i)=><div key={i} className="text-center font-mono">{i===0?'':((q.binA||[])[i-1]||0)}</div>)}
                                        {Array((q.bitsCount||8)+1).fill(0).map((_,i)=><div key={i} className="text-center font-mono border-b border-slate-500">{i===0?'':((q.binB||[])[i-1]||0)}</div>)}
                                        {playerBits.map((b,i)=><button key={i} onClick={()=>handleToggleBit(i)} className={`w-7 h-9 rounded ${b?'bg-blue-600':'bg-slate-700'}`}>{b}</button>)}
                                    </div>
                                </div>
                                <Button onClick={()=>submitAnswer()} className="w-full max-w-xs">SUBMIT</Button>
                            </div>
                        )}
                        {(q.levelType===1||q.levelType===2) && (
                            <div className="w-full flex flex-col items-center">
                                <div className="text-center text-slate-300 font-bold mb-3">Type the missing place value for bit at position: {q.missingIndices?.[0]}</div>
                                <div className="text-slate-400 text-sm mb-2">Decimal = {q.decimal}</div>
                                <div className="flex gap-1 mb-4 flex-wrap justify-center">
                                    {POWERS.map((p,i)=>(
                                        <div key={i} className="flex flex-col items-center">
                                            <div className={`w-10 h-12 border-2 flex items-center justify-center font-bold rounded text-sm ${q.missingIndices?.includes(i)?'border-blue-500 bg-blue-900/40 text-blue-300':'border-slate-700 text-slate-400'}`}>
                                                {q.missingIndices?.includes(i) ? (playerInput||'?') : p}
                                            </div>
                                            <div className="text-slate-500 text-xs mt-1">{q.bits?.[i]}</div>
                                        </div>
                                    ))}
                                </div>
                                <Numpad onInput={handleInput} onDelete={handleDel} onSubmit={()=>{
                                    // Check against first missing index
                                    const correctVal = POWERS[q.missingIndices?.[0]];
                                    const isC = parseInt(playerInput) === correctVal;
                                    setAnswered(true);
                                    const delta = isC ? QUIZ_POINTS_CORRECT : QUIZ_POINTS_WRONG;
                                    setAnswerResult(isC ? 'correct' : 'wrong');
                                    const ns = Math.max(0, playerScore + delta);
                                    setPlayerScore(ns);
                                    db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}/players/${playerId}/score`).set(ns);
                                }}/>
                            </div>
                        )}
                    </>
                )}

                {/* Live leaderboard mini */}
                {lobbyData?.players && (
                    <div className="w-full bg-slate-800/40 rounded-xl p-3 border border-slate-700 mt-2">
                        <div className="text-xs text-slate-500 mb-2 uppercase tracking-widest">Live Scores</div>
                        {Object.entries(lobbyData.players)
                            .sort((a,b)=>(b[1].score||0)-(a[1].score||0))
                            .slice(0,5)
                            .map(([id, p]) => (
                                <div key={id} className={`flex justify-between items-center py-1 text-sm ${id===playerId?'text-blue-400 font-bold':'text-slate-300'}`}>
                                    <span>{p.name}{id===playerId?' (you)':''}</span>
                                    <span className="font-mono">{p.score||0}</span>
                                </div>
                            ))}
                    </div>
                )}
            </div>
        );
    };

    // ---- RENDER VIEWS ----

    if (subView === 'choice') return (
        <div className="h-full flex flex-col items-center justify-center p-6 fade-in bg-slate-900">
            <button onClick={onBack} className="absolute top-4 left-4 p-2 bg-slate-800 rounded-full text-white hover:bg-slate-700">
                <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </button>
            <div className="text-center mb-10">
                <div className="text-5xl mb-3">🎮</div>
                <h2 className="text-3xl font-bold text-white mb-2">Quiz Mode</h2>
                <p className="text-slate-400">Kahoot-style multiplayer — compete live!</p>
                <p className="text-slate-500 text-sm mt-1">Playing as: <span className="text-violet-400 font-bold">{playerName}</span></p>
            </div>
            <div className="flex flex-col gap-4 w-full max-w-sm">
                <button onClick={handleCreateLobby} className="w-full py-5 rounded-2xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-lg shadow-xl shadow-violet-900/40 transition-all active:scale-95 flex items-center justify-center gap-3">
                    <span className="text-2xl">👑</span> Host a Game
                </button>
                <button onClick={() => setSubView('join_code')} className="w-full py-5 rounded-2xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-lg shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 border border-slate-600">
                    <span className="text-2xl">🎯</span> Join a Game
                </button>
            </div>
        </div>
    );

    if (subView === 'join_code') return (
        <div className="h-full flex flex-col items-center justify-center p-6 fade-in bg-slate-900">
            <button onClick={() => setSubView('choice')} className="absolute top-4 left-4 p-2 bg-slate-800 rounded-full text-white hover:bg-slate-700">
                <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </button>
            <div className="text-center mb-8">
                <div className="text-5xl mb-3">🎯</div>
                <h2 className="text-2xl font-bold text-white mb-1">Join Game</h2>
                <p className="text-slate-400 text-sm">Enter the 4-character code from your host</p>
            </div>
            <div className="w-full max-w-sm">
                <input
                    type="text"
                    value={joinInput}
                    onChange={e => { setJoinInput(e.target.value.toUpperCase().slice(0,4)); setJoinError(''); }}
                    onKeyDown={e => e.key === 'Enter' && handleJoinLobby()}
                    placeholder="e.g. AB3X"
                    maxLength={4}
                    className="w-full p-5 bg-slate-800 border border-slate-600 rounded-xl text-white text-4xl text-center font-mono tracking-[0.5em] mb-4 focus:outline-none focus:border-violet-500"
                />
                {joinError && <p className="text-red-400 text-sm mb-4 text-center">{joinError}</p>}
                <Button onClick={handleJoinLobby} disabled={joinInput.length !== 4} className="w-full text-lg py-4" variant="quiz">
                    Join →
                </Button>
            </div>
        </div>
    );

    if (subView === 'host_lobby') {
        const players = lobbyData?.players ? Object.entries(lobbyData.players) : [];
        return (
            <div className="h-full flex flex-col p-4 bg-slate-900 fade-in overflow-y-auto custom-scrollbar">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold text-violet-400">Host Lobby</h2>
                    <button onClick={handleDeleteLobby} className="px-3 py-1 bg-red-900/50 hover:bg-red-800 text-red-400 rounded-lg text-sm border border-red-800">Close Lobby</button>
                </div>

                {/* Code display */}
                <div className="bg-violet-900/30 border border-violet-600/50 rounded-2xl p-6 text-center mb-6">
                    <div className="text-slate-400 text-xs uppercase tracking-widest mb-2">Game Code</div>
                    <div className="text-6xl font-mono font-bold text-violet-300 tracking-widest">{lobbyCode}</div>
                    <div className="text-slate-500 text-xs mt-2">Share this code with players</div>
                </div>

                {/* Config */}
                <div className="bg-slate-800 rounded-xl p-4 mb-4 border border-slate-700">
                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Game Settings</h3>
                    <div className="flex gap-4 flex-wrap">
                        <div className="flex-1 min-w-[120px]">
                            <label className="text-xs text-slate-500 block mb-1">Questions</label>
                            <select
                                value={hostConfig.numQuestions}
                                onChange={e => { const v={...hostConfig,numQuestions:parseInt(e.target.value)}; setHostConfig(v); db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}/config`).set(v); }}
                                className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm"
                            >
                                {[5,10,15,20].map(n=><option key={n} value={n}>{n} Questions</option>)}
                            </select>
                        </div>
                        <div className="flex-1 min-w-[180px]">
                            <label className="text-xs text-slate-500 block mb-1">Category</label>
                            <select
                                value={hostConfig.categoryId}
                                onChange={e => { const v={...hostConfig,categoryId:e.target.value}; setHostConfig(v); db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}/config`).set(v); }}
                                className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-white text-sm"
                            >
                                {QUIZ_CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
                            </select>
                        </div>
                    </div>
                </div>

                {/* Players */}
                <div className="bg-slate-800 rounded-xl p-4 mb-6 border border-slate-700 flex-1">
                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Players ({players.length})</h3>
                    <div className="space-y-2">
                        {players.map(([pid, p]) => (
                            <div key={pid} className="flex items-center justify-between bg-slate-700/50 rounded-lg px-4 py-3">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-violet-600 flex items-center justify-center text-sm font-bold">{p.name[0].toUpperCase()}</div>
                                    <span className="font-bold text-white">{p.name}</span>
                                    {p.isHost && <span className="text-xs bg-yellow-600/30 text-yellow-400 px-2 py-0.5 rounded-full">HOST</span>}
                                </div>
                                {!p.isHost && (
                                    <button onClick={() => handleKickPlayer(pid)} className="text-xs text-red-400 hover:text-red-300 bg-red-900/30 px-3 py-1 rounded-lg border border-red-800/50 transition-colors">Kick</button>
                                )}
                            </div>
                        ))}
                        {players.length === 1 && <p className="text-slate-500 text-sm text-center py-4">Waiting for players to join...</p>}
                    </div>
                </div>

                <Button onClick={handleStartQuiz} disabled={players.length < 1} className="w-full py-4 text-lg" variant="quiz">
                    ▶ Start Quiz ({players.length} player{players.length!==1?'s':''})
                </Button>
            </div>
        );
    }

    if (subView === 'join_lobby') {
        const players = lobbyData?.players ? Object.entries(lobbyData.players) : [];
        return (
            <div className="h-full flex flex-col items-center justify-center p-6 bg-slate-900 fade-in">
                <div className="text-center mb-8">
                    <div className="text-4xl mb-3 animate-bounce">⏳</div>
                    <h2 className="text-2xl font-bold text-white mb-2">Waiting for Host</h2>
                    <div className="text-violet-400 font-mono text-lg">Code: <span className="font-bold tracking-widest">{lobbyCode}</span></div>
                </div>
                <div className="bg-slate-800 rounded-2xl p-5 w-full max-w-sm border border-slate-700 mb-6">
                    <div className="text-xs text-slate-500 uppercase tracking-widest mb-3">Players Joined ({players.length})</div>
                    {players.map(([pid,p]) => (
                        <div key={pid} className={`flex items-center gap-3 py-2 border-b border-slate-700/50 last:border-0 ${pid===playerId?'text-blue-400 font-bold':'text-slate-300'}`}>
                            <div className="w-7 h-7 rounded-full bg-violet-700 flex items-center justify-center text-xs font-bold">{p.name[0]}</div>
                            {p.name}{p.isHost?' 👑':''}{pid===playerId?' (you)':''}
                        </div>
                    ))}
                </div>
                <p className="text-slate-500 text-sm">The host will start the game shortly...</p>
                <button onClick={() => { db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}/players/${playerId}`).remove(); setSubView('choice'); }} className="mt-6 text-red-400 text-sm hover:text-red-300">Leave Lobby</button>
            </div>
        );
    }

    if (subView === 'host_game') {
        const q = lobbyData?.questions?.[currentQIdx];
        const players = lobbyData?.players ? Object.entries(lobbyData.players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)) : [];
        const totalQs = lobbyData?.questions?.length || hostConfig.numQuestions;
        return (
            <div className="h-full flex flex-col p-4 bg-slate-900 overflow-y-auto custom-scrollbar fade-in">
                <div className="flex justify-between items-center mb-4">
                    <div className="text-violet-400 font-bold text-lg">Q {currentQIdx+1} / {totalQs}</div>
                    <button onClick={handleHostEndGame} className="px-3 py-1 bg-red-900/50 hover:bg-red-800 text-red-400 rounded-lg text-sm border border-red-800">End Game</button>
                </div>
                <div className="w-full h-1 bg-slate-800 rounded mb-6 overflow-hidden">
                    <div className="h-full bg-violet-500 transition-all" style={{width:`${((currentQIdx+1)/totalQs)*100}%`}}></div>
                </div>

                {/* Current question preview */}
                {q && (
                    <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 mb-4">
                        <div className="text-xs text-slate-500 mb-2">{LEVELS[q.levelType]?.title} question</div>
                        <div className="text-slate-300 text-sm">
                            {q.levelType===4 && <span>Binary: {q.bits?.join('')} → ?</span>}
                            {q.levelType===6 && <span>Hex: {q.hexString} → ?</span>}
                            {q.levelType===7 && <span>Decimal: {q.decimal} → Hex?</span>}
                            {q.levelType===8 && <span>Binary: {q.bits?.join('')} → Hex?</span>}
                            {q.levelType===9 && <span>Hex: {q.hexString} → Binary?</span>}
                            {q.levelType===3 && <span>Make decimal: {q.decimal}</span>}
                            {q.levelType===5 && <span>Binary sum: {q.binA?.join('')} + {q.binB?.join('')}</span>}
                            {(q.levelType===1||q.levelType===2) && <span>Missing place value in: {q.decimal}</span>}
                        </div>
                    </div>
                )}

                {/* Live leaderboard */}
                <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 flex-1 mb-4">
                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3">Live Leaderboard</h3>
                    <div className="space-y-2">
                        {players.map(([pid, p], idx) => (
                            <div key={pid} className="flex items-center justify-between py-2 border-b border-slate-700/50 last:border-0">
                                <div className="flex items-center gap-3">
                                    <span className={`text-lg font-bold ${idx===0?'text-yellow-400':idx===1?'text-slate-300':idx===2?'text-amber-600':'text-slate-500'}`}>{idx+1}.</span>
                                    <span className="text-white">{p.name}</span>
                                    {p.isHost && <span className="text-xs text-yellow-500">HOST</span>}
                                </div>
                                <span className="font-mono font-bold text-violet-400">{p.score||0}</span>
                            </div>
                        ))}
                    </div>
                </div>

                <Button onClick={handleHostNextQuestion} className="w-full py-4 text-lg" variant="quiz">
                    {currentQIdx+1 >= totalQs ? '🏁 Finish & Show Results' : `Next Question (${currentQIdx+2}/${totalQs}) →`}
                </Button>
            </div>
        );
    }

    if (subView === 'join_game') {
        return (
            <div className="h-full flex flex-col p-4 bg-slate-900 overflow-y-auto custom-scrollbar fade-in">
                <div className="flex justify-between items-center mb-2 shrink-0">
                    <div className="text-violet-400 font-bold">Quiz · Q{currentQIdx+1}</div>
                    <div className="font-mono text-white bg-slate-800 px-3 py-1 rounded-full border border-violet-500/30">
                        {playerScore} pts
                    </div>
                </div>
                {renderQuizQuestion()}
            </div>
        );
    }

    if (subView === 'host_results' || subView === 'join_results') {
        const medals = ['🥇','🥈','🥉'];
        return (
            <div className="h-full flex flex-col items-center p-6 bg-slate-900 overflow-y-auto custom-scrollbar fade-in">
                <div className="text-center mb-6">
                    <div className="text-5xl mb-3">🏆</div>
                    <h2 className="text-3xl font-bold text-white">Final Results</h2>
                    <p className="text-slate-400 text-sm mt-1">Game Over · {lobbyCode}</p>
                </div>

                <div className="w-full max-w-md space-y-3 mb-8">
                    {finalScores.map((p, idx) => {
                        const isMe = p.id === playerId;
                        return (
                            <div key={p.id} className={`flex items-center justify-between rounded-xl px-5 py-4 border slide-up ${isMe?'bg-blue-900/30 border-blue-500/50':'bg-slate-800 border-slate-700'}`} style={{animationDelay:`${idx*0.1}s`}}>
                                <div className="flex items-center gap-4">
                                    <span className="text-2xl">{medals[idx] || `${idx+1}.`}</span>
                                    <div>
                                        <div className={`font-bold ${isMe?'text-blue-300':'text-white'}`}>{p.name}{isMe?' (you)':''}</div>
                                        {p.isHost && <div className="text-xs text-yellow-500">HOST</div>}
                                    </div>
                                </div>
                                <div className={`text-2xl font-mono font-bold ${idx===0?'text-yellow-400':'text-violet-400'}`}>{p.score}</div>
                            </div>
                        );
                    })}
                </div>

                {isHost.current && (
                    <button onClick={() => { db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}`).remove(); setSubView('choice'); }} className="mb-3 w-full max-w-md py-3 bg-violet-600 hover:bg-violet-500 text-white font-bold rounded-xl transition-all">
                        Play Again (New Lobby)
                    </button>
                )}
                <button onClick={() => { if(isHost.current) db.ref(`${QUIZ_ROOT}/lobbies/${lobbyCode}`).remove(); onBack(); }} className="w-full max-w-md py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl border border-slate-600 transition-all">
                    Back to Main Menu
                </button>
            </div>
        );
    }

    return null;
};

// ============================================================
// MAIN MENU
// ============================================================
const MainMenu = ({ onStart, isHardMode, setHardMode, onExport, playerName, onQuizMode }) => {
    const [helpLevel, setHelpLevel] = useState(null);
    return (
        <div className="flex flex-col items-center h-full p-4 fade-in overflow-y-auto custom-scrollbar">
            {helpLevel && <HelpModal levelId={helpLevel} onClose={() => setHelpLevel(null)} />}
            <div className="text-center mb-4 mt-6">
                <h1 className="text-4xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 mb-1">BINARY BLITZ</h1>
                <p className="text-slate-400 text-sm">Master the bits. 10 Levels.</p>
                <p className="text-violet-400 text-xs mt-1 font-mono">👤 {playerName}</p>
            </div>
            <div className="flex gap-3 mb-5 flex-wrap justify-center items-center">
                <Toggle checked={isHardMode} onChange={setHardMode} label="HARD MODE" />
                <Button variant="success" className="py-2 px-4 text-sm h-9" onClick={onExport}>Export Report</Button>
                <Button variant="quiz" className="py-2 px-4 text-sm h-9" onClick={onQuizMode}>🎮 Quiz Mode</Button>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full max-w-6xl pb-24">
                {Object.entries(LEVELS).map(([id, data]) => {
                    const scores = getScores(id);
                    const topScore = scores.length > 0 ? scores[0].score : '-';
                    const isExam = id === '10';
                    return (
                        <div key={id} className={`bg-slate-800 rounded-xl p-4 border border-slate-700 hover:border-${data.color}-500 transition-all flex flex-col relative group`}>
                            <div className="flex justify-between items-start mb-2">
                                <h2 className={`text-lg font-bold text-${data.color}-400`}>{data.title}</h2>
                                <button onClick={() => setHelpLevel(id)} className="text-slate-500 hover:text-white bg-slate-700 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold transition-colors">?</button>
                            </div>
                            <p className="text-xs text-slate-400 mb-4">{data.desc}</p>
                            <div className="flex-1"></div>
                            <div className="flex justify-between items-end mt-4">
                                {isExam ? (
                                    <div className="text-xs text-slate-500">Last: <span className="text-white font-mono">{getExamHistory().length > 0 ? getExamHistory().slice(-1)[0].score + '/15' : '-'}</span></div>
                                ) : (
                                    <div className="text-xs text-slate-500">Best: <span className="text-white font-mono">{topScore}</span></div>
                                )}
                                <button onClick={() => onStart(parseInt(id))} className={`px-4 py-2 rounded-lg bg-${data.color}-600 hover:bg-${data.color}-500 text-white font-bold text-sm shadow-lg`}>{isExam ? 'START' : 'PLAY'}</button>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
};

const GameOver = ({ score, level, onRestart, onHome }) => (
    <div className="flex flex-col items-center justify-center h-full p-4 fade-in space-y-8 text-center bg-slate-900/95 z-50 absolute inset-0">
        <h2 className="text-6xl font-bold text-red-500 shake">GAME OVER</h2>
        <div className="bg-slate-800 p-8 rounded-2xl border-2 border-slate-700 shadow-2xl w-full max-w-sm">
            <p className="text-slate-400 uppercase tracking-widest text-sm mb-2">Level {level} Score</p>
            <p className="text-7xl font-mono font-bold text-white">{score}</p>
        </div>
        <div className="flex flex-col space-y-3 w-full max-w-xs">
            <Button onClick={onRestart} className="w-full text-lg">Try Again</Button>
            <Button onClick={onHome} variant="secondary" className="w-full">Back to Menu</Button>
        </div>
    </div>
);

const ExamResults = ({ score, total, duration, onHome }) => (
    <div className="flex flex-col items-center justify-center h-full p-4 fade-in space-y-8 text-center bg-slate-900 z-50 absolute inset-0">
        <h2 className="text-5xl font-bold text-white mb-4">Exam Complete</h2>
        <div className="bg-slate-800 p-8 rounded-2xl border-2 border-slate-700 shadow-2xl w-full max-w-md">
            <div className="text-slate-400 uppercase tracking-widest text-sm mb-2">Score</div>
            <div className="text-6xl font-mono font-bold text-rose-400 mb-6">{score} <span className="text-2xl text-slate-500">/ {total}</span></div>
            <div className="flex justify-between text-sm border-t border-slate-700 pt-4">
                <span className="text-slate-400">Time Taken:</span>
                <span className="text-white font-mono">{formatTime(duration)}</span>
            </div>
        </div>
        <Button onClick={onHome} variant="primary" className="w-full max-w-xs">Return to Menu</Button>
    </div>
);

// ============================================================
// APP ROOT
// ============================================================
const App = () => {
    const [playerName, setPlayerName] = useState(() => localStorage.getItem('binaryBlitz_playerName') || '');
    const [nameConfirmed, setNameConfirmed] = useState(() => !!localStorage.getItem('binaryBlitz_playerName'));
    const [view, setView] = useState('menu');
    const [activeLevel, setActiveLevel] = useState(1);
    const [lastScore, setLastScore] = useState(0);
    const [lastExamStats, setLastExamStats] = useState(null);
    const [isHardMode, setHardMode] = useState(false);
    const [showExport, setShowExport] = useState(false);
    const [showHelp, setShowHelp] = useState(false);
    const sessionStart = useRef(Date.now());
    const [sessionStats, setSessionStats] = useState({});

    useEffect(() => {
        let keyBuffer = '';
        const handleKeyDown = (e) => {
            if (e.shiftKey && e.key.length === 1) {
                keyBuffer += e.key.toUpperCase();
                if (keyBuffer.length > 3) keyBuffer = keyBuffer.slice(-3);
                if (keyBuffer === 'DEV') { window.open('analyser.html', '_blank'); keyBuffer = ''; }
            } else if (!e.shiftKey) { keyBuffer = ''; }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, []);

    const handleNameSubmit = (name) => {
        setPlayerName(name);
        localStorage.setItem('binaryBlitz_playerName', name);
        setNameConfirmed(true);
    };

    const updateStats = (level, score, duration, correct, wrong) => {
        setSessionStats(prev => {
            const current = prev[level] || { plays: 0, time: 0, best: 0, correct: 0, wrong: 0 };
            return { ...prev, [level]: { plays: current.plays + 1, time: current.time + duration, best: Math.max(current.best, score), correct: current.correct + correct, wrong: current.wrong + wrong } };
        });
    };

    const handleGameOver = (score, level, duration, correct, wrong) => {
        saveScore(score, level); saveActivity(level, score, duration, correct, wrong);
        updateStats(level, score, duration, correct, wrong);
        setLastScore(score); setActiveLevel(level); setView('gameover');
    };

    const handleExit = (level, duration, correct, wrong, score) => {
        if (level !== 10) saveScore(score, level);
        saveActivity(level, score, duration, correct, wrong);
        updateStats(level, score, duration, correct, wrong);
        setView('menu');
    };

    const handleExamFinish = (score, total, duration, details) => {
        saveExamResult(score, total, duration, details);
        saveActivity(10, score, duration, score, total - score);
        updateStats(10, score, duration, score, total - score);
        setLastExamStats({ score, total, duration });
        setView('exam_results');
    };

    if (!nameConfirmed) return <NamePrompt onSubmit={handleNameSubmit} />;

    return (
        <div className="w-full h-full relative">
            <DraggableCalculator />
            {showExport && <ExportModal onClose={() => setShowExport(false)} />}
            {showHelp && <HelpModal levelId={activeLevel} onClose={() => setShowHelp(false)} />}

            {view === 'menu' && (
                <MainMenu
                    onStart={(lvl) => { setActiveLevel(lvl); setView(lvl === 10 ? 'exam' : 'game'); }}
                    isHardMode={isHardMode}
                    setHardMode={setHardMode}
                    onExport={() => setShowExport(true)}
                    playerName={playerName}
                    onQuizMode={() => setView('quiz')}
                />
            )}

            {view === 'quiz' && (
                <QuizModeMenu playerName={playerName} onBack={() => setView('menu')} />
            )}

            {view === 'game' && (
                activeLevel===1 ? <Level1Comp onExit={handleExit} onGameOver={handleGameOver} isHardMode={isHardMode} onHelp={() => setShowHelp(true)}/> :
                activeLevel===2 ? <Level2Comp onExit={handleExit} onGameOver={handleGameOver} isHardMode={isHardMode} onHelp={() => setShowHelp(true)}/> :
                activeLevel===3 ? <Level3Comp onExit={handleExit} onGameOver={handleGameOver} isHardMode={isHardMode} onHelp={() => setShowHelp(true)}/> :
                <GenericLevel level={activeLevel} onExit={handleExit} onGameOver={handleGameOver} isHardMode={isHardMode} onHelp={() => setShowHelp(true)}/>
            )}

            {view === 'exam' && <ExamLevel onExit={(l,d) => handleExit(l,d,0,0,0)} onFinish={handleExamFinish} isHardMode={isHardMode}/>}
            {view === 'gameover' && <GameOver score={lastScore} level={activeLevel} onRestart={() => setView('game')} onHome={() => setView('menu')}/>}
            {view === 'exam_results' && <ExamResults {...lastExamStats} onHome={() => setView('menu')}/>}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
